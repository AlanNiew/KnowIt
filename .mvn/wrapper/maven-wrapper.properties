# KnowIt 使用 Maven Wrapper 的 script-only 模式（Maven Wrapper 3.2.0+ 默认）：
# 不需要 maven-wrapper.jar，首次执行时自动下载指定版本的 Maven。
# 升级 Maven 版本：改下面的 distributionUrl，然后提交 PR（对应 ADR-0015）。
#
# 本地验证命令（在解除 shell 沙箱后执行一次）：
#   ./mvnw -N wrapper:wrapper -Dmaven=3.9.9
# 若本文件被 wrapper 插件改写，以插件输出的为准。
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip